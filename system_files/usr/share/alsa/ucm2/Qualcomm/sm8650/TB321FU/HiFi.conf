SectionVerb {
	EnableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		cset "name='SpkrLeft PCM Playback Volume' 348"
		cset "name='SpkrRight PCM Playback Volume' 348"
		cset "name='SpkrLeft Playback Switch' 1"
		cset "name='SpkrRight Playback Switch' 1"
	]
	DisableSequence [
		cset "name='SpkrLeft Playback Switch' 0"
		cset "name='SpkrRight Playback Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

If.wcd {
	Condition {
		Type ControlExists
		Control "name='HPHL Switch'"
	}
	True {
		SectionDevice."Headphones" {
			Comment "Headphones"

			Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"
			Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
			Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
			Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
			Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

			Value {
				PlaybackChannels 2
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},0"
				PlaybackMixer "default:${CardId}"
				PlaybackMixerElem "HP"
				JackControl "Headphone Jack"
				JackHWMute "Speaker"
			}
		}

		SectionDevice."Headset" {
			Comment "Headset Microphone"

			Include.wcdmice.File "/codecs/wcd939x/HeadphoneMicEnableSeq.conf"
			Include.wcdmicd.File "/codecs/wcd939x/HeadphoneMicDisableSeq.conf"
			Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
			Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

			Value {
				CaptureChannels 2
				CapturePriority 300
				CapturePCM "hw:${CardId},2"
				CaptureMixerElem "ADC2"
				JackControl "Mic Jack"
			}
		}
	}
}
